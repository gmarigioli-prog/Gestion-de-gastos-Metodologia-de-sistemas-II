<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestor personal de ingresos, gastos y ahorros." />
    <title>FinanzApp | Gestor de gastos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">FinanzApp</a>
      <span class="status">Demo local</span>
    </header>

    <main class="container">
      <section class="hero">
        <div>
          <p class="eyebrow">Gestión personal</p>
          <h1>Controlá tus movimientos</h1>
          <p class="hero-copy">Registrá ingresos, gastos y ahorros en un solo lugar.</p>
        </div>
        <div class="hero-icon" aria-hidden="true">$</div>
      </section>

      <section class="summary-grid" aria-label="Resumen financiero">
        <article class="summary-card">
          <span>Balance</span>
          <strong id="balance">$0,00</strong>
        </article>
        <article class="summary-card income">
          <span>Ingresos</span>
          <strong id="income-total">$0,00</strong>
        </article>
        <article class="summary-card expense">
          <span>Gastos</span>
          <strong id="expense-total">$0,00</strong>
        </article>
        <article class="summary-card savings">
          <span>Ahorros</span>
          <strong id="savings-total">$0,00</strong>
        </article>
      </section>

      <section class="content-grid">
        <article class="panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Nuevo movimiento</p>
              <h2>Agregar registro</h2>
            </div>
          </div>

          <form id="movement-form">
            <label>
              Tipo
              <select id="movement-type" required>
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
                <option value="ahorro">Ahorro</option>
              </select>
            </label>
            <label>
              Descripción
              <input id="movement-description" type="text" placeholder="Ej. Supermercado" maxlength="60" required />
            </label>
            <label>
              Monto
              <input id="movement-amount" type="number" min="0.01" step="0.01" placeholder="0,00" required />
            </label>
            <label>
              Fecha
              <input id="movement-date" type="date" required />
            </label>
            <button class="primary-button" type="submit">Guardar movimiento</button>
          </form>
        </article>

        <article class="panel">
          <div class="panel-heading list-heading">
            <div>
              <p class="eyebrow">Actividad</p>
              <h2>Últimos movimientos</h2>
            </div>
            <button class="secondary-button" id="undo-button" type="button" disabled title="Se habilitará en una próxima versión">
              Deshacer
            </button>
          </div>
          <div id="movement-list" class="movement-list" aria-live="polite"></div>
          <p id="empty-state" class="empty-state">Todavía no hay movimientos registrados.</p>
        </article>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
